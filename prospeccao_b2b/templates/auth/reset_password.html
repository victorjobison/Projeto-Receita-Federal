{% extends "shared/base.html" %}
{% block title %}Resetar senha · Prospeccao B2B{% endblock %}

{% block content %}
<section class="auth-panel">
    <div>
        <h1>Definir nova senha</h1>
        <p>O link e valido por 1 hora e so pode ser usado uma vez.</p>
    </div>

    <form method="post" class="panel form-stack">
        <label>
            Nova senha
            <input type="password" name="senha" minlength="8" required autofocus>
        </label>
        <label>
            Confirmar senha
            <input type="password" name="confirmar_senha" minlength="8" required>
        </label>
        <button type="submit">Alterar senha</button>
    </form>
</section>
{% endblock %}
